name: marqueeflow
description: MarqueeFlow booking platform - admin panel, API, and Flutter mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#7A1028"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  # Launcher icon source only — not bundled in APK (saves ~1.2 MB); icons live in android/res.
