# Staging API — proxy to marqueeflow-backend-staging (port 4012).
# One-time VPS: copy to /etc/nginx/sites-available/, enable, certbot, reload nginx.
server {
    listen 80;
    listen [::]:80;
    server_name api-staging.marqueeflow.com;

    location / {
        proxy_pass http://127.0.0.1:4012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
