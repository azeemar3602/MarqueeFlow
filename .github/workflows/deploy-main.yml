name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4

      - name: Deploy MarqueeFlow to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ vars.MARQUEEFLOW_DEPLOY_PATH || '/var/www/marqueeflow' }}"
            cd "$DEPLOY_PATH"
            git fetch origin main
            git checkout main
            git pull origin main
            cd backend && npm ci && npm run build
            cd ../admin-panel && npm ci && npm run build
            pm2 reload marqueeflow-backend --update-env || pm2 start ecosystem.config.cjs --only marqueeflow-backend
            pm2 reload marqueeflow-admin --update-env || pm2 start ecosystem.config.cjs --only marqueeflow-admin
            pm2 save
            curl -fsS http://127.0.0.1:4010/api/health
            curl -fsS http://127.0.0.1:4011/ >/dev/null
