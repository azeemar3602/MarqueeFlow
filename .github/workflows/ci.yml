name: CI

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [test]

jobs:
  deployment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$|credentials\.json|\.pem$'; then
            echo "Secret-like files must not be committed"
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  admin-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  pr-to-main-gate:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [deployment-safety, backend, admin-panel, flutter]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed for PR to main"
