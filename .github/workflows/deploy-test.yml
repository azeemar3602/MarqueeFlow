name: Deploy Staging

on:
  push:
    branches: [test]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy MarqueeFlow staging to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH="${{ vars.MARQUEEFLOW_DEPLOY_PATH || '/var/www/marqueeflow' }}"
            cd "$DEPLOY_PATH"
            git fetch origin test
            git checkout test
            git pull origin test
            cd backend && npm ci && npm run build
            cd ../admin-panel && npm ci && npm run build
            pm2 reload marqueeflow-backend --update-env
            curl -fsS http://127.0.0.1:4010/api/health
            test -f admin-panel/dist/index.html
